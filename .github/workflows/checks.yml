name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libchromaprint1
      - run: uv sync --frozen
      - run: uv run ruff check src scripts tests
      - run: uv run python -m unittest discover -s tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.13'
      - run: uv run --no-project python scripts/feishin-restore-source.py
      - run: uv run --no-project python scripts/feishin-build.py
