[project]
name = "musica"
version = "0.1.0"
description = "Self-hosted music library, playlist discovery radio and automatic imports"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beets[chroma,embedart,fetchart]>=2.4.0,<3",
  "yt-dlp[default]>=2025.11.12,<2027",
  "yt-dlp-ejs>=0.3.2,<1",
  "pylast>=7.0.2",
]

[project.scripts]
musica-sync = "musica_sync.cli:main"
musica-curate = "musica_sync.curation:main"

[dependency-groups]
dev = [
  "ruff>=0.11.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musica_sync"]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
